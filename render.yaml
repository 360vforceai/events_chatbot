# Optional Render Blueprint — deploy the Discord bot as an always-on worker.
# Set env vars in the Render dashboard (never commit real values).
# Web app: deploy `web/` separately on Vercel with NEXT_PUBLIC_API_URL pointing at the API service.

services:
  - type: web
    name: seer-api
    runtime: docker
    dockerfilePath: ./bot/Dockerfile
    dockerContext: ./bot
    plan: starter
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

  - type: worker
    name: seer-discord-bot
    runtime: docker
    dockerfilePath: ./bot/Dockerfile.bot
    dockerContext: ./bot
    plan: starter
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
